<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gigs — Fiverr Seller Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="content">
    <h1>Gigs</h1>
    <p class="subtitle">Fiverr has no gig-write API, so edits here update your local copy only — not your live Fiverr gig (see docs/fiverr-api-capabilities.md).</p>

    <div class="grid grid-2" id="gigs-grid">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    async function loadGigs() {
      const { gigs } = await apiJSON("/gigs");
      const grid = document.getElementById("gigs-grid");
      if (!gigs || !gigs.length) {
        grid.innerHTML = '<p class="muted">No gigs yet. Import a CSV from Settings.</p>';
        return;
      }
      grid.innerHTML = gigs
        .map(
          (g) =>
            `<div class="card"><h2>${escapeHTML(g.title)}</h2>` +
            `<p class="muted">${escapeHTML(g.category || "Uncategorized")} · <span class="badge badge-status">${escapeHTML(g.status)}</span></p>` +
            `<p>${formatCents(g.base_price_cents, g.currency)} starting</p>` +
            `<p>${escapeHTML(g.description || "").slice(0, 160)}</p></div>`
        )
        .join("");
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      renderShell("gigs.html");
      await loadGigs();
    })();
  </script>
</body>
</html>
