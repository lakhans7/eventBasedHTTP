<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Fiverr Seller Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Then add your Fiverr profile from Settings.</p>
      <div id="error" class="error-banner" style="display:none"></div>
      <div id="success" class="success-banner" style="display:none"></div>
      <form id="register-form">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create account</button>
      </form>
      <div class="auth-links"><a href="/login.html">Already have an account? Log in</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      errorEl.style.display = "none";
      try {
        await apiJSON("/auth/register", {
          method: "POST",
          body: {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          },
        });
        successEl.textContent = "Account created. Check your email to verify it, then log in.";
        successEl.style.display = "block";
        document.getElementById("register-form").reset();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
