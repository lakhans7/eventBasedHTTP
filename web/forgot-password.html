<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Fiverr Seller Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="subtitle">We'll email you a reset link if an account exists.</p>
      <div id="success" class="success-banner" style="display:none"></div>
      <form id="form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Send reset link</button>
      </form>
      <div class="auth-links"><a href="/login.html">Back to log in</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await apiFetch("/auth/forgot-password", { method: "POST", body: { email: document.getElementById("email").value } });
      document.getElementById("success").style.display = "block";
      document.getElementById("success").textContent = "If that email is registered, a reset link is on its way.";
      document.getElementById("form").reset();
    });
  </script>
</body>
</html>
