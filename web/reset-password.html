<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Fiverr Seller Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <div id="error" class="error-banner" style="display:none"></div>
      <div id="success" class="success-banner" style="display:none"></div>
      <form id="form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Reset password</button>
      </form>
      <div class="auth-links"><a href="/login.html">Back to log in</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      try {
        await apiJSON("/auth/reset-password", { method: "POST", body: { token, new_password: document.getElementById("password").value } });
        document.getElementById("success").style.display = "block";
        document.getElementById("success").textContent = "Password reset. You can log in now.";
        document.getElementById("form").style.display = "none";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
