<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify email — Fiverr Seller Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Verifying your email…</h1>
      <div id="result"></div>
      <div class="auth-links"><a href="/login.html">Back to log in</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const token = new URLSearchParams(location.search).get("token");
      const el = document.getElementById("result");
      try {
        await apiJSON("/auth/verify-email", { method: "POST", body: { token } });
        el.innerHTML = '<div class="success-banner">Your email is verified. You can log in now.</div>';
      } catch (err) {
        el.innerHTML = '<div class="error-banner">' + escapeHTML(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
